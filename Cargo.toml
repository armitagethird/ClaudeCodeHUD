[package]
name = "hud"
version = "0.1.0"
edition = "2021"
description = "Lightweight, bug-resistant statusline HUD for Claude Code"
license = "MIT"

[[bin]]
name = "hud"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
